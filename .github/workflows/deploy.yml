name: SSH Deploy

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: ☕️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build production bundle
        run: pnpm build

      - name: 🚀 Deploy to server
        uses: easingthemes/ssh-deploy@v2.1.5
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: '-rltgoDzvO --delete'
          # No trailing slash: rsync copies the .output directory itself into TARGET,
          # so the server ends up with <TARGET>/.output/server/index.mjs (matches pm2 script path).
          SOURCE: '.output'
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ secrets.REMOTE_TARGET }}

      - name: � Write pm2 config on server
        # The deploy payload is only .output/, so rsync --delete would wipe any
        # ecosystem.config.cjs sitting in TARGET. Re-create it explicitly before
        # (re)starting the app, and start from that path so cwd matches the
        # relative script path './.output/server/index.mjs'.
        uses: JimCronqvist/action-ssh@master
        with:
          hosts: '${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}'
          privateKey: ${{ secrets.SERVER_SSH_KEY }}
          command: |
            cat > ${{ secrets.REMOTE_TARGET }}/ecosystem.config.cjs << 'EOF'
            module.exports = {
              apps: [
                {
                  name: 'livmarolf',
                  port: '3003',
                  exec_mode: 'cluster',
                  instances: 'max',
                  script: './.output/server/index.mjs'
                }
              ]
            }
            EOF

      - name: 🔃 Restart pm2 app
        uses: JimCronqvist/action-ssh@master
        with:
          hosts: '${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}'
          privateKey: ${{ secrets.SERVER_SSH_KEY }}
          command: |
            cd ${{ secrets.REMOTE_TARGET }} && pm2 startOrReload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
