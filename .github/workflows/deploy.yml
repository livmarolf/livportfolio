name: SSH Deploy

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: ☕️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Must match the server's Node major (currently 22) — better-sqlite3
          # is a native module built for this ABI, so a mismatch breaks content.
          node-version: 22
          cache: pnpm

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build production bundle
        run: pnpm build

      # Ship the pm2 config inside .output so it's part of every rsync payload.
      # Without this, --delete would wipe it from TARGET on each deploy (it lives
      # in TARGET, not inside .output). Must be named *.js — the server runs
      # pm2 4.2.0, which only auto-detects .js/.json ecosystem files and would
      # otherwise execute a .cjs file as a plain script.
      - name: 📝 Add pm2 config to deploy payload
        run: cp ecosystem.config.js .output/ecosystem.config.js

      - name: 🚀 Deploy to server
        uses: easingthemes/ssh-deploy@v2.1.5
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          ARGS: '-rltgoDzvO --delete'
          # No trailing slash: rsync copies the .output directory itself into TARGET,
          # so the server ends up with <TARGET>/.output/server/index.mjs (matches pm2 script path).
          SOURCE: '.output'
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ secrets.REMOTE_TARGET }}

      - name: 🔃 Restart pm2 app
        uses: JimCronqvist/action-ssh@master
        with:
          hosts: '${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}'
          privateKey: ${{ secrets.SERVER_SSH_KEY }}
          # The config ships inside .output, so on the server it lives at
          # <TARGET>/.output/ecosystem.config.js. cd to TARGET first so the
          # relative script path './.output/server/index.mjs' resolves (pm2 uses
          # the cwd where it was invoked as the app's cwd).
          # startOrReload handles the normal case (app already running);
          # the fallback covers a fresh server / deleted process.
          # pm2 save persists the list so the app survives a server reboot.
          command: |
            cd ${{ secrets.REMOTE_TARGET }} && (pm2 startOrReload .output/ecosystem.config.js --update-env || pm2 start .output/ecosystem.config.js) && pm2 save
